<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>請求データ 修正ワークフロー</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin:0; font-family:'Hiragino Sans','Meiryo',sans-serif; min-height:100vh; background:#0F0F1A; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:48px 40px; max-width:440px; width:100%; text-align:center; box-shadow:0 24px 64px rgba(0,0,0,0.4); }
  .icon { width:72px; height:72px; background:linear-gradient(135deg,#4338CA,#6366F1); border-radius:20px; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; font-size:32px; }
  .brand { font-size:11px; color:#6366F1; font-weight:700; letter-spacing:0.15em; margin-bottom:8px; }
  h1 { font-size:22px; font-weight:800; color:#fff; margin:0 0 20px; }
  .badge { display:inline-block; background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.4); color:#A5B4FC; border-radius:20px; padding:6px 18px; font-size:13px; font-weight:700; margin-bottom:20px; }
  p { font-size:14px; color:rgba(255,255,255,0.5); line-height:1.8; margin:0; }
  .date { font-size:18px; color:#fff; font-weight:800; margin:4px 0 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128203;</div>
    <div class="brand">JUST FINE Inc.</div>
    <h1>請求データ 修正ワークフロー</h1>
    <div class="badge">公開準備中</div>
    <p>本システムは下記日程より運用開始予定です。</p>
    <div class="date">2026年10月1日（木）</div>
    <p>公開までしばらくお待ちください。</p>
  </div>
</body>
</html>
